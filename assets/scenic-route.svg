<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">C. I took the scenic route.</title>
  <desc id="desc">Systems thinker and operator. An editorial burgundy title card with cream and peach lettering, and a wandering line from psychology to company building and software.</desc>
