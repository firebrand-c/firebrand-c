    <text x="1148" y="47" text-anchor="end">ISTANBUL</text>
  </g>
  <g fill="none" stroke="#AD6870" stroke-width="2" opacity=".75">
    <path d="M-55 287C51 492 271 430 264 313C257 170 142 192 189 281C252 399 444 409 614 374C811 334 902 308 971 208C1030 123 911 107 910 213C909 315 1113 256 1259 81"/>
  </g>
  <circle cx="614" cy="374" r="6" fill="#AD6870"/>
  <text x="47" y="189" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="140" letter-spacing="-8">I took the</text>
  <text x="241" y="320" fill="#E8B3A1" font-family="Georgia, 'Times New Roman', serif" font-size="130" font-style="italic" letter-spacing="-6">scenic route.</text>
